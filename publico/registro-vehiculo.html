<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07B5D5">
    <title>Raity - Registro de vehículo</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/imagenes/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <div id="barra-sin-conexion" class="barra-sin-conexion">
        Sin conexión a internet. Algunas funciones no están disponibles.
    </div>

    <div class="fondo-manchas">
        <div class="mancha-azul-superior"></div>
        <div class="mancha-azul-media"></div>
        <div class="mancha-amarilla-inferior"></div>
    </div>

    <main class="contenedor-principal">
        <a href="/perfil.html" class="enlace-regresar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            <span>Registro de vehículo</span>
        </a>

        <div id="aviso-registro-vehiculo" class="aviso-error"></div>

        <form id="formulario-vehiculo" class="tarjeta-blanca" enctype="multipart/form-data">
            <div class="grupo-campo">
                <label for="vehiculo-modelo" class="etiqueta-campo">Modelo del vehículo</label>
                <input type="text" id="vehiculo-modelo" name="modelo" class="campo-entrada" placeholder="Ej. Nissan March">
            </div>

            <div class="grupo-campo">
                <label for="vehiculo-matricula" class="etiqueta-campo">Matrícula vehicular</label>
                <input type="text" id="vehiculo-matricula" name="matricula" class="campo-entrada" placeholder="Ej. BAM2428">
            </div>

            <div class="grupo-campo">
                <label for="vehiculo-color" class="etiqueta-campo">Color del vehículo</label>
                <input type="text" id="vehiculo-color" name="color" class="campo-entrada" placeholder="Ej. Negro">
            </div>

            <div class="grupo-campo">
                <label for="vehiculo-asientos" class="etiqueta-campo">Asientos disponibles del vehículo</label>
                <select id="vehiculo-asientos" name="numero_asientos" class="campo-entrada">
                    <option value="1">1 Asiento</option>
                    <option value="2">2 Asientos</option>
                    <option value="3">3 Asientos</option>
                    <option value="4" selected>4 Asientos</option>
                </select>
            </div>

            <div class="grupo-campo">
                <span class="etiqueta-campo">Credencial universitaria vigente</span>
                <label class="area-subida">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#07B5D5" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <circle cx="9" cy="11" r="2"/>
                        <line x1="14" y1="10" x2="18" y2="10"/>
                        <line x1="14" y1="14" x2="18" y2="14"/>
                    </svg>
                    <p>Toca aquí para subir foto de tu credencial</p>
                    <input type="file" id="vehiculo-credencial" name="foto_credencial" accept="image/*">
                    <span id="nombre-credencial" class="nombre-archivo-subido"></span>
                </label>
            </div>

            <div class="grupo-campo">
                <span class="etiqueta-campo">Foto del vehículo</span>
                <label class="area-subida">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#07B5D5" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <p>Toca aquí para subir foto de tu vehículo</p>
                    <input type="file" id="vehiculo-foto" name="foto_vehiculo" accept="image/*">
                    <span id="nombre-foto-vehiculo" class="nombre-archivo-subido"></span>
                </label>
            </div>

            <button type="submit" class="boton boton-principal">Registrar vehículo</button>
        </form>
    </main>

    <nav class="barra-navegacion">
        <a href="/explorar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
            <span>Explorar</span>
        </a>
        <a href="/buscar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Buscar</span>
        </a>
        <a href="/publicar.html" class="boton-publicar-central" aria-label="Publicar viaje">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </a>
        <a href="/mis-viajes.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 11l2-5h10l2 5"/>
                <rect x="3" y="11" width="18" height="6" rx="2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            <span>Viajes</span>
        </a>
        <a href="/perfil.html" class="enlace-nav activo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <span>Perfil</span>
        </a>
    </nav>

    <script src="/js/comun.js"></script>
    <script src="/js/registro-vehiculo.js"></script>
    <script src="/js/registrar-sw.js"></script>
</body>
</html>
