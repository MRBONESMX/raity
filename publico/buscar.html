<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#057A91">
    <title>Raity - Viajes Disponibles</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/imagenes/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <div id="barra-sin-conexion" class="barra-sin-conexion">
        Sin conexión a internet. Algunas funciones no están disponibles.
    </div>

    <div class="fondo-manchas">
        <div class="mancha-azul-superior"></div>
        <div class="mancha-azul-media"></div>
        <div class="mancha-amarilla-inferior"></div>
    </div>

    <main class="contenedor-principal">
        <div class="encabezado-pagina">
            <h1 class="titulo-pagina">Viajes Disponibles</h1>
        </div>

        <div class="grupo-campo">
            <label for="campo-buscar" class="etiqueta-campo">Buscar viaje por destino, colonia o conductor</label>
            <div class="caja-busqueda">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" id="campo-buscar" class="campo-entrada campo-busqueda" placeholder="Ej. UABCS, Santa Fe, Marco...">
            </div>
        </div>

        <div class="barra-filtros" role="group" aria-label="Filtros rápidos de viajes">
            <button type="button" class="chip-filtro activo" data-filtro="todos" aria-pressed="true">Todos</button>
            <button type="button" class="chip-filtro" data-filtro="uabcs" aria-pressed="false">Hacia UABCS</button>
            <button type="button" class="chip-filtro" data-filtro="santafe" aria-pressed="false">Santa Fe</button>
            <button type="button" id="filtro-violeta" class="chip-filtro formulario-oculto" data-filtro="violeta" aria-pressed="false">Raity Violeta</button>
        </div>

        <p id="contador-viajes" class="texto-ayuda margen-abajo" role="status" aria-live="polite">Cargando viajes disponibles...</p>

        <div id="aviso-buscar" class="aviso-error"></div>
        <div id="lista-viajes" class="lista-viajes"></div>
    </main>

    <nav class="barra-navegacion" aria-label="Navegación principal">
        <a href="/explorar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
            <span>Explorar</span>
        </a>
        <a href="/buscar.html" class="enlace-nav activo" aria-current="page">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Buscar</span>
        </a>
        <a href="/publicar.html" class="boton-publicar-central">
            <span class="circulo-publicar" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </span>
            <span>Publicar</span>
        </a>
        <a href="/mis-viajes.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M5 11l2-5h10l2 5"/>
                <rect x="3" y="11" width="18" height="6" rx="2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            <span>Viajes</span>
        </a>
        <a href="/perfil.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <span>Perfil</span>
        </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/comun.js"></script>
    <script src="/js/buscar.js"></script>
    <script src="/js/registrar-sw.js"></script>
</body>
</html>
