<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07B5D5">
    <title>Raity - Mi Viaje</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/imagenes/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <div id="barra-sin-conexion" class="barra-sin-conexion">
        Sin conexión a internet. Algunas funciones no están disponibles.
    </div>

    <div class="fondo-manchas">
        <div class="mancha-azul-superior"></div>
        <div class="mancha-azul-media"></div>
        <div class="mancha-amarilla-inferior"></div>
    </div>

    <main class="contenedor-principal">
        <a href="/mis-viajes.html" class="enlace-regresar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            <span>Mi viaje</span>
        </a>

        <div id="aviso-mi-viaje" class="aviso-error"></div>

        <section id="resumen-viaje" class="tarjeta-viaje"></section>

        <div id="mapa-mi-viaje" class="mapa-detalle"></div>

        <section class="tarjeta-blanca">
            <div class="cabecera-usuario">
                <h2 class="nombre-conductor">Pasajeros unidos</h2>
                <span id="conteo-pasajeros" class="insignia insignia-verde">0/4</span>
            </div>
            <div id="lista-pasajeros"></div>
        </section>

        <section id="acciones-mi-viaje"></section>
    </main>

    <nav class="barra-navegacion">
        <a href="/explorar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
            <span>Explorar</span>
        </a>
        <a href="/buscar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Buscar</span>
        </a>
        <a href="/publicar.html" class="boton-publicar-central" aria-label="Publicar viaje">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </a>
        <a href="/mis-viajes.html" class="enlace-nav activo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 11l2-5h10l2 5"/>
                <rect x="3" y="11" width="18" height="6" rx="2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            <span>Viajes</span>
        </a>
        <a href="/perfil.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <span>Perfil</span>
        </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/comun.js"></script>
    <script src="/js/mi-viaje.js"></script>
    <script src="/js/registrar-sw.js"></script>
</body>
</html>
