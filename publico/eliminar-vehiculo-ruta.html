<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#057A91">
    <title>Raity - Eliminar vehículo o ruta</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/imagenes/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <div id="barra-sin-conexion" class="barra-sin-conexion">
        Sin conexión a internet. Algunas funciones no están disponibles.
    </div>

    <div class="fondo-manchas">
        <div class="mancha-azul-superior"></div>
        <div class="mancha-azul-media"></div>
        <div class="mancha-amarilla-inferior"></div>
    </div>

    <main class="contenedor-principal">
        <a href="/perfil.html" class="enlace-regresar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            <span>Volver al perfil</span>
        </a>

        <div class="encabezado-pagina">
            <h1 class="titulo-pagina">Eliminar vehículo o ruta</h1>
        </div>

        <div id="aviso-eliminar" class="aviso-error"></div>
        <div id="exito-eliminar" class="aviso-exito"></div>

        <section class="tarjeta-blanca">
            <h2 class="subtitulo-pagina">Vehículos registrados</h2>
            <div class="grupo-campo">
                <label for="eliminar-select-vehiculo" class="etiqueta-campo">Tus vehículos</label>
                <select id="eliminar-select-vehiculo" class="campo-entrada"></select>
            </div>
            <p id="resumen-vehiculo-eliminar" class="resumen-seleccion formulario-oculto"></p>
            <button type="button" id="boton-eliminar-vehiculo" class="boton boton-rojo">Eliminar vehículo</button>
        </section>

        <section class="tarjeta-blanca">
            <h2 class="subtitulo-pagina">Rutas guardadas</h2>
            <div class="grupo-campo">
                <label for="eliminar-select-ruta" class="etiqueta-campo">Tus rutas guardadas</label>
                <select id="eliminar-select-ruta" class="campo-entrada"></select>
            </div>
            <div id="mapa-eliminar-ruta" class="minimapa margen-abajo" role="region" aria-label="Mapa de la ruta seleccionada para eliminar"></div>
            <button type="button" id="boton-eliminar-ruta" class="boton boton-rojo">Eliminar ruta</button>
        </section>

        <a href="/perfil.html" class="boton boton-secundario">Volver al perfil</a>
    </main>

    <nav class="barra-navegacion" aria-label="Navegación principal">
        <a href="/explorar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
            <span>Explorar</span>
        </a>
        <a href="/buscar.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Buscar</span>
        </a>
        <a href="/publicar.html" class="boton-publicar-central">
            <span class="circulo-publicar" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </span>
            <span>Publicar</span>
        </a>
        <a href="/mis-viajes.html" class="enlace-nav">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M5 11l2-5h10l2 5"/>
                <rect x="3" y="11" width="18" height="6" rx="2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            <span>Viajes</span>
        </a>
        <a href="/perfil.html" class="enlace-nav activo" aria-current="page">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <span>Perfil</span>
        </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/comun.js"></script>
    <script src="/js/eliminar-vehiculo-ruta.js"></script>
    <script src="/js/registrar-sw.js"></script>
</body>
</html>
